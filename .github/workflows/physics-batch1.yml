name: Physics Batch 1 source checks
on:
  push:
    branches:
      - feature/physics-batch1-geas-20261028
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/validatePhysicsBatch1.ts
      - run: npm run lint
      - run: npm run build
      - name: Test guarded ZIP merge against original main source snapshot
        run: |
          git fetch origin main --depth=1
          git archive --format=zip origin/main -o /tmp/physics-baseline.zip
          git archive --format=zip HEAD -o /tmp/physics-feature.zip
          python3 scripts/mergePhysicsBatch1IntoZip.py \
            --baseline /tmp/physics-baseline.zip \
            --feature /tmp/physics-feature.zip \
            --output /tmp/physics-batch1-merged.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/physics-batch1-merged.zip') as z:
              names=set(z.namelist())
              required={
                  'src/features/physics/physicsCurriculum.ts',
                  'src/features/physics/PhysicsScreen.tsx',
                  'scripts/validatePhysicsBatch1.ts',
                  'PHYSICS_BATCH1_MERGE_REPORT.json'
              }
              assert required <= names
              app=z.read('src/App.tsx').decode()
              assert "currentScreen === 'physics' && <PhysicsScreen />" in app
          print("Merged ZIP feature/source check PASS")
          PY
