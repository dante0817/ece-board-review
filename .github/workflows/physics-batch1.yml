name: Physics Batch 1 source checks
on:
  push:
    branches:
      - feature/physics-batch1-geas-20261028
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/validatePhysicsBatch1.ts
      - run: npm run lint
      - run: npm run build
